name: Publish TCM corpus dataset

# Re-publishes the curated corpus (TCM-MKG alignment + evidence grading) to the
# standalone public repo lm203688/tcm-mkg. Use it after refreshing evidence grades
# or pulling upstream TCM-MKG, so consumers always pull a current snapshot.
#
# Required repo secret:
#   GH_PAT   a classic PAT with `public_repo` scope (workflow GITHUB_TOKEN cannot
#            write to a *different* repo).
#
# Run manually: Actions -> Publish TCM corpus dataset -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, do not write to GitHub"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GH_PAT lets the job write to the *other* repo lm203688/tcm-mkg; the
      # job's own GITHUB_TOKEN cannot. When it is absent, skip cleanly with a
      # hint instead of failing red (the corpus is already published — see
      # data/publish_dataset_repo.py for local re-publish).
      - name: Publish dataset repo
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT not configured — skipping corpus re-publish."
            echo "The corpus is already published at https://github.com/lm203688/tcm-mkg."
            echo "Re-publish locally with: python data/publish_dataset_repo.py --push"
            exit 0
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python data/publish_dataset_repo.py
          else
            python data/publish_dataset_repo.py --push
          fi

      - name: Verify published blobs
        if: ${{ !inputs.dry_run }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT not configured — nothing to verify."
            exit 0
          fi
          python data/verify_dataset_repo.py
