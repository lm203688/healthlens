name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # 【2026-09-15 修复】此前本步骤是 Lint & Test 作业连续报红的直接原因。
        # pyproject.toml 缺 [tool.setuptools.packages.find]，仓库根目录有多个顶层
        # 目录（app/ healthlens_agent/ skills/ alembic/ frontend/ data/ nginx/
        # reports/ goai_borrow/ ...），setuptools 走 flat-layout 自动发现时直接报：
        #   error: Multiple top-level packages discovered in a flat-layout
        # 已通过在 pyproject.toml 显式声明包发现规则修复（同时让 Dockerfile 的
        # `pip install .` 也不再踩同一个坑）。先升级 pip/setuptools 保证 PEP 621
        # 与 [build-system] requires 被正确解析。
        #
        # 【2026-10-17 D2 依赖锁定】所有测试依赖走 constraints.txt + hash，
        # 保证 Zenodo DOI 与论文"reproduce from source"承诺可兑现。若 hash 不符
        # 直接 exit 1——把"三个月后装出的是另一个系统"从可能性变成不可能。
        run: |
          pip install --upgrade pip "setuptools>=70" wheel
          pip install -e ".[dev]" -c constraints.txt --require-hashes

      - name: Constraints integrity gate
        # 【D2 门禁】确保 requirements.txt 与 constraints.txt 无冲突、无遗漏。
        # --dry-run 只在虚拟环境中解析，不落盘；hash 校验失败即失败。
        run: |
          pip install --dry-run --report /tmp/constraints_report.json \
            --require-hashes -c constraints.txt -r requirements.txt > /dev/null
          echo "constraints.txt + requirements.txt resolve OK with hashes"

      - name: Version sync gate
        # 防止 agent-card.json version 与 pyproject.toml 漂移（历史上复发 3 次：
        # 2026-10-15、2026-10-16、以及每次手工修完仍会再漂移）。
        # --check 模式不改盘，只门禁；不一致直接 exit 1 阻断主分支。
        run: python tools/sync_version.py --check

      - name: Run tests
        id: tests
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml 2>&1 | tee pytest.out
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          DEBUG: "true"

      - name: 测试必须零失败（P0-26 硬门禁）
        # 【2026-10-08 P0-26 修复】此前 BASELINE=31 让 31 个失败测试视为"正常"，
        # CI 实际不拦截任何东西（报告《HealthLens 全面提升评估报告》P0-26）。
        # 现改为零失败硬门禁：任何 failed / error 都直接 exit 1。
        # 历史债务（2026-09 前 API 返回结构 vs 测试断言不一致）应在主分支
        # 上逐条修复，而不是把它们固化成"正常基线"——那只会掩盖真实的回归。
        #
        # 若收集期崩溃（conftest / import 阶段 ModuleNotFoundError），pytest 不
        # 会输出 "N passed" 汇总；这里显式区分这两种情况，让真正的错误冒泡。
        if: always()
        run: |
          FAILED=$(grep -oE '[0-9]+ failed' pytest.out 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || true)
          PASSED=$(grep -oE '[0-9]+ passed' pytest.out 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || true)
          ERRORS=$(grep -oE '[0-9]+ error' pytest.out 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || true)

          # 收集期崩溃：pytest 根本没跑起来
          if [ -z "$PASSED" ]; then
            echo "::error::pytest 未完成收集（无 passed 汇总）——conftest 或导入阶段崩溃"
            grep -E "ImportError|ModuleNotFoundError|^E  " pytest.out 2>/dev/null | head -20
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| pytest 收集 | **未完成（conftest 或导入阶段崩溃）** |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "| 测试通过 | ${PASSED:-0} |"
            echo "| 测试失败 | ${FAILED:-0} |"
            [ -n "$ERRORS" ] && echo "| 测试错误 | $ERRORS |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ERRORS" ] && [ "$ERRORS" -gt 0 ]; then
            echo "::error::存在 $ERRORS 个测试错误，硬门禁失败"
            exit 1
          fi

          if [ -z "$FAILED" ]; then FAILED=0; fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::测试失败数 $FAILED，硬门禁要求零失败（P0-26）"
            exit 1
          fi

          echo "测试全部通过（$PASSED passed / 0 failed）"

      - name: Test-count manifest drift gate
        # 【2026-10-18 消除 A5' 复发根因】submissions/medrxiv 的 manifest、
        # cover_letter、data_availability_statement、reviewer_guidance 四份文件
        # 都硬编码了 "N automated tests pass"。此前每次测试集变动都需要手工同步
        # （10-17 S7、10-18 A5' 就是同一个坑三次复发）。
        #
        # 现在：先扫描四份文件的 N 值，若不一致即硬失败；若一致但与本次 pytest
        # 实际 passed 数不同，也硬失败——开发者必须显式跑
        # `python tools/sync_test_count.py --apply --pytest-out pytest.out` 重新
        # 落盘并 commit，才能进主分支。
        if: always()
        run: |
          python tools/sync_test_count.py --check
          ACTUAL=$(grep -oE '[0-9]+ passed' pytest.out | tail -1 | grep -oE '^[0-9]+' || echo 0)
          MANIFEST=$(python tools/sync_test_count.py --print || echo "")
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" = "0" ]; then
            echo "::error::无法从 pytest.out 解析 passed 数"
            exit 1
          fi
          if [ "$ACTUAL" != "$MANIFEST" ]; then
            echo "::error::submission manifest 声明 ${MANIFEST}，但本次 pytest 实际通过 ${ACTUAL}"
            echo "::error::运行 \`python tools/sync_test_count.py --apply --pytest-out pytest.out\` 并 commit"
            exit 1
          fi
          echo "manifest 与 pytest 一致：${ACTUAL} passed"

      - name: Type check (mypy)
        # 【2026-10-08 P0-26】mypy 也升级为硬门禁；--ignore-missing-imports
        # 保留以兼容第三方无类型包，但本项目内错误必须清零。
        run: mypy app/ --ignore-missing-imports

      - name: Lint (ruff)
        # 【2026-10-08 P0-26】ruff 改为硬门禁。历史 420 项 lint 债务必须
        # 通过人工 / `ruff --fix` 一次性清理，而不是继续用 continue-on-error
        # 让债务永久豁免（报告指出这是"三重架空"之一）。
        run: ruff check app/ tests/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # --------------------------------------------------------------------------
  # 【2026-10-27 P0-QA-01】Windows 跨平台门禁（双 CI 之二）。
  #
  # 背景：全面评估报告 §三 P0 质量项发现，本机 Windows 分组测试有 19 个失败
  # 全部集中于 GBK 解码子进程输出（subprocess.run 在 Windows 默认区域
  # cp936/GBK 下解码 UTF-8 中文输出失败，或子进程自身因 stdout 编码为 GBK
  # 抛 UnicodeEncodeError）。这使跨平台贡献者与发布结果不可复现。
  #
  # 修复：① 所有 subprocess.run 捕获点统一 encoding="utf-8", errors="replace"；
  # ② tests/conftest.py 顶层 os.environ.setdefault("PYTHONIOENCODING", "utf-8")
  # 让派生的 Python 子进程以 UTF-8 输出；③ 本 job 在 Windows 上真实跑这些
  # 子进程密集型测试，任何 GBK 回归立即失败。
  #
  # 说明：不能复用主 job 的 `-c constraints.txt --require-hashes`——该文件
  # 的 sha256 是 Linux wheel 的（2026-10-17 用 pip install --dry-run 生成），
  # Windows 会解析到不同平台的 wheel 而 hash 不匹配。故 Windows 走无 hash
  # 安装（版本仍由 pyproject 的 [dev] 声明约束），专责测编码可复现性。
  # --------------------------------------------------------------------------
  windows-subprocess-test:
    name: Windows Subprocess Encoding Test (GBK guard)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (no hash pin — constraints.txt is Linux-wheel hashes)
        run: |
          pip install --upgrade pip "setuptools>=70" wheel
          pip install -e ".[dev]"

      - name: Run subprocess-heavy tests (GBK regression guard)
        # 目标：P0-QA-01 修复前在 Windows 上失败的那批子进程捕获测试。
        # 任一失败即退出非零 → 跨平台可复现性被破坏，必须修复后再合入。
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          pytest tests/tools/test_sync_test_count.py tests/tools/test_causal_end_to_end.py tests/tools/test_checklist_audit.py tests/tools/test_fill_placeholders.py tests/tools/test_literature_triangulation_cvi.py tests/test_version_sync.py tests/lib/test_graphrag_security.py tests/lib/test_reliability_bootstrap.py tests/test_indicator_content_validity.py -v --tb=short

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: healthlens:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # 【2026-10-17 D1 / 2026-10-18 补齐】重型库 CI 真实执行：
  #   dowhy / causalinference / scipy（science）+ flwr（federated）
  # --------------------------------------------------------------------------
  # 背景（10-16 全面评估报告 §8.3 技术债 #2 + §5.2）：
  #   app/lib/dowhy_adapter.py 的严格模式分支（`dowhy_mode="dowhy"`）此前
  #   被 `pragma: no cover` 或 monkeypatch 跳过，CI 从不装 dowhy，真实分支
  #   从未执行过。历史 dowhy 死代码 bug 正是产于此——纯 Python 回退掩盖了
  #   真实分支的语法/行为错误，"装有 dowhy"路径与生产实际路径长期分叉。
  #   本 job 装 .[science] extra 后跑 dowhy 严格模式测试，任何分支回归即失败。
  #
  #   2026-10-18 补齐（D1 验收 flwr 部分）：加装 .[federated]（flwr），
  #   并跑 tests/test_heavy_lib_ci.py——flwr fabric 严格模式分支同样
  #   不再被 pragma: no cover 掩盖。
  #
  # 与主 lint-and-test 分开的理由：dowhy 依赖 pandas/scipy/scikit-learn，
  # flwr 依赖 grpcio；单轮安装 40–60s；主 job 走精简依赖秒级启动，
  # 本 job 独立跑避免拖累。
  # --------------------------------------------------------------------------
  heavy-lib-test:
    name: Heavy Library Test (dowhy / flwr / science)
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with science + federated extras
        run: |
          pip install --upgrade pip "setuptools>=70" wheel
          pip install -e ".[dev,science,federated]"
          python -c "import dowhy; print('dowhy', dowhy.__version__)"
          python -c "import flwr; print('flwr', flwr.__version__)"

      - name: Run dowhy strict mode tests
        run: |
          pytest tests/lib/test_dowhy_adapter.py -v --tb=short \
            -k "strict_mode_has_engine_fields or forces_dowhy" \
            2>&1 | tee dowhy.out
          grep -E "passed|failed|error" dowhy.out | tail -5

      - name: Run heavy library real-execution tests (flwr / optional engines)
        # flwr 已真实安装：test_flower_adapter_loads / test_flower_fabric_strict_mode_smoke
        # 不再 skip；未装的可选引擎（pymc/xgrammar/ragas/biomni）按设计诚实跳过。
        run: |
          pytest tests/test_heavy_lib_ci.py -v --tb=short 2>&1 | tee heavy.out
          grep -E "passed|failed|error|skipped" heavy.out | tail -5

  # --------------------------------------------------------------------------
  # Agent 能力库测试：不依赖 FastAPI，精简环境即可验证 GOAI 借鉴落地的代码
  #
  # 【2026-09-15 修复】本作业此前连续报红，且与 Skills Test 同根同源：
  #   app/lib/fusion_engine.py 第 29 行
  #     from app.core.bioage_engine import BioAgeEngine, ...
  # 会在 import 时触发 app/__init__.py，后者构建整个 FastAPI 应用，于是精简
  # 环境里直接 ModuleNotFoundError: No module named 'fastapi'。
  # 已改为按文件路径 importlib 加载 bioage_engine（它自身只用标准库），
  # fusion_engine 从此真正 stdlib-only。本地在拦截 fastapi/loguru/slowapi 的
  # 环境里实测 48/48 通过。
  # --------------------------------------------------------------------------
  agent-lib-test:
    name: Agent Library Test (no FastAPI deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent-lib deps only
        run: pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check healthlens_agent

      - name: Run agent-lib tests
        run: pytest healthlens_agent/tests -v --tb=short

  # --------------------------------------------------------------------------
  # Skills 测试：验证 3 个 Seed Skill 的 run.py + test.py
  #
  # 【2026-09-15 修复】与 Agent Library Test 同根同源：skills/fusion_inference/
  # run.py 也用 importlib 加载 fusion_engine.py，后者原来的
  # `from app.core.bioage_engine import ...` 触发了 app/__init__.py 的
  # `from fastapi import FastAPI`，精简环境里直接 ModuleNotFoundError。
  # 修 fusion_engine.py 一处，两个作业同时转绿（见 Agent Library Test 注释）。
  # --------------------------------------------------------------------------
  skills-test:
    name: Skills Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run skill tests
        run: |
          python skills/tcm_text_mining/test.py
          python skills/fusion_inference/test.py
          python skills/evidence_grading/test.py