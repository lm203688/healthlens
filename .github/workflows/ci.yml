name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # 【2026-09-15 修复】此前本步骤是 Lint & Test 作业连续报红的直接原因。
        # pyproject.toml 缺 [tool.setuptools.packages.find]，仓库根目录有多个顶层
        # 目录（app/ healthlens_agent/ skills/ alembic/ frontend/ data/ nginx/
        # reports/ goai_borrow/ ...），setuptools 走 flat-layout 自动发现时直接报：
        #   error: Multiple top-level packages discovered in a flat-layout
        # 已通过在 pyproject.toml 显式声明包发现规则修复（同时让 Dockerfile 的
        # `pip install .` 也不再踩同一个坑）。先升级 pip/setuptools 保证 PEP 621
        # 与 [build-system] requires 被正确解析。
        run: |
          pip install --upgrade pip "setuptools>=70" wheel
          pip install -e ".[dev]"

      - name: Run tests
        id: tests
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml 2>&1 | tee pytest.out
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          DEBUG: "true"

      - name: 测试必须零失败（P0-26 硬门禁）
        # 【2026-10-08 P0-26 修复】此前 BASELINE=31 让 31 个失败测试视为"正常"，
        # CI 实际不拦截任何东西（报告《HealthLens 全面提升评估报告》P0-26）。
        # 现改为零失败硬门禁：任何 failed / error 都直接 exit 1。
        # 历史债务（2026-09 前 API 返回结构 vs 测试断言不一致）应在主分支
        # 上逐条修复，而不是把它们固化成"正常基线"——那只会掩盖真实的回归。
        #
        # 若收集期崩溃（conftest / import 阶段 ModuleNotFoundError），pytest 不
        # 会输出 "N passed" 汇总；这里显式区分这两种情况，让真正的错误冒泡。
        if: always()
        run: |
          FAILED=$(grep -oE '[0-9]+ failed' pytest.out 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || true)
          PASSED=$(grep -oE '[0-9]+ passed' pytest.out 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || true)
          ERRORS=$(grep -oE '[0-9]+ error' pytest.out 2>/dev/null | tail -1 | grep -oE '^[0-9]+' || true)

          # 收集期崩溃：pytest 根本没跑起来
          if [ -z "$PASSED" ]; then
            echo "::error::pytest 未完成收集（无 passed 汇总）——conftest 或导入阶段崩溃"
            grep -E "ImportError|ModuleNotFoundError|^E  " pytest.out 2>/dev/null | head -20
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| pytest 收集 | **未完成（conftest 或导入阶段崩溃）** |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "| 测试通过 | ${PASSED:-0} |"
            echo "| 测试失败 | ${FAILED:-0} |"
            [ -n "$ERRORS" ] && echo "| 测试错误 | $ERRORS |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ERRORS" ] && [ "$ERRORS" -gt 0 ]; then
            echo "::error::存在 $ERRORS 个测试错误，硬门禁失败"
            exit 1
          fi

          if [ -z "$FAILED" ]; then FAILED=0; fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::测试失败数 $FAILED，硬门禁要求零失败（P0-26）"
            exit 1
          fi

          echo "测试全部通过（$PASSED passed / 0 failed）"

      - name: Type check (mypy)
        # 【2026-10-08 P0-26】mypy 也升级为硬门禁；--ignore-missing-imports
        # 保留以兼容第三方无类型包，但本项目内错误必须清零。
        run: mypy app/ --ignore-missing-imports

      - name: Lint (ruff)
        # 【2026-10-08 P0-26】ruff 改为硬门禁。历史 420 项 lint 债务必须
        # 通过人工 / `ruff --fix` 一次性清理，而不是继续用 continue-on-error
        # 让债务永久豁免（报告指出这是"三重架空"之一）。
        run: ruff check app/ tests/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: healthlens:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Agent 能力库测试：不依赖 FastAPI，精简环境即可验证 GOAI 借鉴落地的代码
  #
  # 【2026-09-15 修复】本作业此前连续报红，且与 Skills Test 同根同源：
  #   app/lib/fusion_engine.py 第 29 行
  #     from app.core.bioage_engine import BioAgeEngine, ...
  # 会在 import 时触发 app/__init__.py，后者构建整个 FastAPI 应用，于是精简
  # 环境里直接 ModuleNotFoundError: No module named 'fastapi'。
  # 已改为按文件路径 importlib 加载 bioage_engine（它自身只用标准库），
  # fusion_engine 从此真正 stdlib-only。本地在拦截 fastapi/loguru/slowapi 的
  # 环境里实测 48/48 通过。
  # --------------------------------------------------------------------------
  agent-lib-test:
    name: Agent Library Test (no FastAPI deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent-lib deps only
        run: pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check healthlens_agent

      - name: Run agent-lib tests
        run: pytest healthlens_agent/tests -v --tb=short

  # --------------------------------------------------------------------------
  # Skills 测试：验证 3 个 Seed Skill 的 run.py + test.py
  #
  # 【2026-09-15 修复】与 Agent Library Test 同根同源：skills/fusion_inference/
  # run.py 也用 importlib 加载 fusion_engine.py，后者原来的
  # `from app.core.bioage_engine import ...` 触发了 app/__init__.py 的
  # `from fastapi import FastAPI`，精简环境里直接 ModuleNotFoundError。
  # 修 fusion_engine.py 一处，两个作业同时转绿（见 Agent Library Test 注释）。
  # --------------------------------------------------------------------------
  skills-test:
    name: Skills Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run skill tests
        run: |
          python skills/tcm_text_mining/test.py
          python skills/fusion_inference/test.py
          python skills/evidence_grading/test.py