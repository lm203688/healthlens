name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports || true

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          DEBUG: "true"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: healthlens:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  # Agent 能力库测试：不依赖 FastAPI，精简环境即可验证 GOAI 借鉴落地的代码
  # --------------------------------------------------------------------------
  agent-lib-test:
    name: Agent Library Test (no FastAPI deps)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent-lib deps only
        run: pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check healthlens_agent

      - name: Run agent-lib tests
        run: pytest healthlens_agent/tests -v --tb=short

  # --------------------------------------------------------------------------
  # Skills 测试：验证 3 个 Seed Skill 的 run.py + test.py
  # --------------------------------------------------------------------------
  skills-test:
    name: Skills Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run skill tests
        run: |
          python skills/tcm_text_mining/test.py
          python skills/fusion_inference/test.py
          python skills/evidence_grading/test.py