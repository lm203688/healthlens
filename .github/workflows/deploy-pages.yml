name: 部署静态站到 Cloudflare Pages

# 解决的问题：
#   此前 deploy 阶段永久 dry_run，43 个已生成的 HTML 从未上线过一次。
#   config.json 里的 ssh_host 还错误地指向了另一个项目（AIShield）的服务器。
#   这里改用 Cloudflare Pages —— 零成本、无服务器、无休眠、全球 CDN。

on:
  push:
    branches: [main]
    paths:
      - 'healthlens/frontend/**'
      - 'reports/**'
      - 'auto-pipeline/content/**'
      - 'auto-pipeline/scripts/phase_6_deploy/build_site.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建静态产物
        run: python auto-pipeline/scripts/phase_6_deploy/build_site.py

      # 构建器自身会做产物校验并在异常时返回非 0。
      # 这里再加一层独立断言：宁可不上线，也不要上线一个空壳或错误内容。
      - name: 产物完整性断言
        run: |
          set -e
          D=auto-pipeline/dist
          test -s "$D/index.html"   || { echo "::error::index.html 缺失"; exit 1; }
          test -s "$D/sitemap.xml"  || { echo "::error::sitemap.xml 缺失"; exit 1; }
          test -s "$D/llms.txt"     || { echo "::error::llms.txt 缺失"; exit 1; }
          grep -q "HealthLens" "$D/index.html" || { echo "::error::首页缺少站点标识，疑似内容来源错误"; exit 1; }
          N=$(find "$D/knowledge" -name '*.html' | wc -l)
          echo "知识页面数: $N"
          [ "$N" -ge 10 ] || { echo "::error::知识页面仅 $N 个，低于最低阈值 10，拒绝部署"; exit 1; }
          echo "产物校验通过：$(du -sh $D | cut -f1)"

      # 缺少 Cloudflare 凭据时跳过部署，避免首次推送就出现红色失败。
      # 用户填入 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 后，下一次推送会自动部署。
      - name: 部署到 Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy auto-pipeline/dist --project-name=healthlens --branch=main

      # 部署后必须复验。此前的教训：没有验证的部署等于没有部署。
      # 默认用 Cloudflare 自动分配的 *.pages.dev 域名（无需改 DNS 即可访问）；
      # 若已配置自定义域名 healthlens.cc，可改为该域名。
      - name: 上线后复验
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          echo "等待 CDN 传播..."
          sleep 25
          FAIL=0
          for p in / /llms.txt /sitemap.xml /robots.txt; do
            CODE=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 "https://healthlens.pages.dev$p" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "  OK    $p  ($CODE)"
            else
              echo "  FAIL  $p  ($CODE)"; FAIL=1
            fi
          done
          # 身份校验：200 不代表是自己的站（8-04 事故：源站返回的是 AIShield 的内容）
          if curl -s --max-time 20 "https://healthlens.pages.dev/" | grep -q "HealthLens"; then
            echo "  OK    站点身份校验通过"
          else
            echo "::error::站点返回内容不含 HealthLens 标识"; FAIL=1
          fi
          exit $FAIL
