name: 构建与校验静态站

# 说明：实际部署由 Cloudflare Pages 的「连接 GitHub」原生集成完成
# （Cloudflare 后台连 lm203688/healthlens，构建命令 python auto-pipeline/scripts/phase_6_deploy/build_site.py，
#  输出目录 auto-pipeline/dist）。本工作流只负责在每次 push 时构建并做内容完整性校验，
#  不依赖任何 Cloudflare API Token，保持绿色。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建静态产物
        run: python auto-pipeline/scripts/phase_6_deploy/build_site.py

      - name: 产物完整性断言
        run: |
          set -e
          test -s auto-pipeline/dist/index.html || { echo "::error::index.html 缺失"; exit 1; }
          grep -q "HealthLens" auto-pipeline/dist/index.html || { echo "::error::首页缺少站点标识，疑似内容来源错误"; exit 1; }
          N=$(find auto-pipeline/dist/knowledge -name '*.html' | wc -l)
          echo "知识页面数: $N"
          [ "$N" -ge 10 ] || { echo "::error::知识页面仅 $N 个，低于最低阈值 10"; exit 1; }
          echo "产物校验通过：$(du -sh auto-pipeline/dist | cut -f1)"
