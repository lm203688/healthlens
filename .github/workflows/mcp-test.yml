name: MCP Server Test

on:
  push:
    branches: [main]
    paths:
      - "healthlens_agent/mcp_server.py"
      - "healthlens_agent/__main__.py"
      - "healthlens_agent/safety.py"
      - "mcp-server/**"
      - "pyproject.toml"
  pull_request:
    paths:
      - "healthlens_agent/mcp_server.py"
      - "healthlens_agent/__main__.py"
      - "mcp-server/**"
  workflow_dispatch:

jobs:
  mcp-smoke:
    name: Smoke test (JSON-RPC + tool layering)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (no MCP dep required - JSON-RPC fallback)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -c "import healthlens_agent; print('import ok')"

      - name: Tool listing (--demo)
        run: |
          python -m healthlens_agent mcp --demo > demo_out.txt
          cat demo_out.txt
          grep -q "HealthLens MCP Server" demo_out.txt
          grep -q "hl_health_check" demo_out.txt
          grep -q "hl_search_knowledge" demo_out.txt
          grep -q "hl_get_axis_detail" demo_out.txt
          grep -q "hl_suggest_general_diet" demo_out.txt
          grep -q "hl_suggest_general_motion" demo_out.txt
          grep -q "\[LOCKED\] hl_fusion_engine" demo_out.txt
          grep -q "Private tools exposed: False" demo_out.txt

      - name: JSON-RPC tools/list
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | python -m healthlens_agent mcp --jsonrpc > tools_list.out
          cat tools_list.out
          python scripts/check_tools_list.py

      - name: JSON-RPC tool call (hl_get_axis_detail)
        run: |
          echo '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"hl_get_axis_detail","arguments":{"axis_id":"A"}}}' \
            | python -m healthlens_agent mcp --jsonrpc > axis_a.out
          cat axis_a.out
          python scripts/check_axis_a.py

      - name: JSON-RPC tool call (hl_search_knowledge)
        run: |
          echo '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"hl_search_knowledge","arguments":{"query":"qi deficiency"}}}' \
            | python -m healthlens_agent mcp --jsonrpc > search.out
          cat search.out
          python scripts/check_search.py

      - name: L3 gate opens only when HL_MCP_EXPOSE_PRIVATE=1
        run: |
          HL_MCP_EXPOSE_PRIVATE=1 python -m healthlens_agent mcp --demo > demo_private.txt
          cat demo_private.txt
          grep -q "Private tools exposed: True" demo_private.txt
          grep -q "hl_fusion_engine" demo_private.txt
          grep -q "hl_risk_assess" demo_private.txt
          grep -q "hl_tcm_constitution" demo_private.txt
          grep -q "hl_evidence_grade" demo_private.txt
          ! grep -q "\[LOCKED\]" demo_private.txt

      - name: Env vars parse without error
        run: |
          HL_MCP_RATE_LIMIT=5 HL_MCP_EXPOSE_PRIVATE=1 HL_MCP_OAUTH_ENABLED=1 \
            python -m healthlens_agent mcp --demo > /dev/null
          echo "OK: env vars parse without error"

      - name: server.json validity
        run: |
          python scripts/check_server_json.py

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-smoke-${{ github.run_id }}
          path: |
            demo_out.txt
            demo_private.txt
            tools_list.out
            axis_a.out
            search.out
          retention-days: 7
