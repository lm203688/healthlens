# ------------------------------------------------------------------
# 审阅门槛（CI 门禁建议）
# ------------------------------------------------------------------
review_gates:
  - "任何新增端点必须先补入本表，缺失则 claims_engine 默认 red（fail-closed）"
  - "red 状态端点必须返回 403 而非降级放行"
  - "amber 状态端点必须经过 claims_engine.filter_output() 过滤"
  - "证据等级 L3 的功能需季度复审，L1 功能每 12 个月复审"
  - "US FDA Wellness Final Rule 更新时需全表复审"
  - "伊利诺伊州 Psychological Resources Act 已确认免责声明失效——所有 US 区状态必须基于 claims 实质而非免责声明"
