<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Outer lens ring -->
    <circle r="160" fill="none" stroke="white" stroke-width="12" opacity="0.9"/>
    <!-- Inner lens ring -->
    <circle r="120" fill="none" stroke="white" stroke-width="6" opacity="0.4"/>
    <!-- Crosshair horizontal -->
    <line x1="-180" y1="0" x2="-160" y2="0" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="160" y1="0" x2="180" y2="0" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <!-- Crosshair vertical -->
    <line x1="0" y1="-180" x2="0" y2="-160" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="160" x2="0" y2="180" stroke="white" stroke-width="8" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle r="16" fill="white"/>
    <!-- Data pulse arc -->
    <path d="M -80 -60 Q -40 -80 0 -40 Q 40 0 80 -20" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M -60 60 Q -30 40 0 80 Q 30 100 60 60" fill="none" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
