<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>离线模式 · HealthLens</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8fafc;
    color: #1e293b;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    padding: 3rem 2rem;
    max-width: 400px;
  }
  .icon {
    font-size: 4rem;
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: 1.5rem;
    color: #047857;
    margin-bottom: 0.75rem;
  }
  p {
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 2rem;
  }
  button {
    background: #059669;
    color: white;
    border: none;
    padding: 0.75rem 2rem;
    font-size: 1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #047857; }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>当前处于离线模式</h1>
    <p>您正在查看缓存内容。重新连接网络后将自动更新。</p>
    <button onclick="navigator.serviceWorker.getRegistration().then(reg => reg && reg.update())">
      检查更新
    </button>
  </div>
</body>
</html>
