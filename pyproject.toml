[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthlens"
version = "0.31.1"
description = "HealthLens - 中西医融合健康管理平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "asyncpg",
    "pydantic>=2.0",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "loguru",
    "httpx",
    "celery[redis]",
    "redis",
    "fhir.resources",
    "pillow",
    "numpy",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
    "cryptography>=41.0",
    "pyyaml>=6.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.0",
    "prometheus-client>=0.19.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# PaddleOCR 体积大（paddlepaddle 约 120MB + opencv/shapely 等传递依赖），
# 且只在 app/core/ocr_engine.py 的函数体内惰性 import，不属于启动必需。
# 挪成可选 extra 后 CI 安装从「拉 GB 级重型栈」降为「秒级」，Docker 用 .[ocr] 装回。
ocr = [
    "paddlepaddle>=2.5.0",
    "paddleocr>=2.7.0",
]

# L2 表征层：传感器基础模型（Pulse-PPG / PaPaGei）。
# 报告出处：《HealthLens_下一阶段愿景与跃迁方案_2026-10-15》§5 L2。
# 内核仍保持零第三方依赖；此 extra 用于「可选依赖的重型科学层」。
# 未安装时 app/lib/sensor_adapter.py 的 list_available_engines() 会返回
# available=False + reason，load_pulse_ppg_model/load_papagei_model 抛
# HealthLensUnavailableEngine，zero_shot_embed_wellness 提供 20 维手工
# 特征 fallback 作为 baseline。
sensing = [
    "torch>=2.0",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
]

# D1 重型库 CI 真实执行（2026-10-17，10-16 全面评估报告 D1）：
# dowhy / flwr / pymc / xgrammar / ragas / biomni 等重型科学层。
# 内核仍保持"零第三方依赖"约束（app/lib/engine_exceptions.py 兜底），
# 但生产/CI 上必须能真实执行——之前 `pragma: no cover` + CI 从不装
# 导致 dowhy 严格模式分支从未真实跑过（历史 dowhy 死代码 bug 的根因）。
#
# 用法：CI 独立 job 装 .[science] 后跑 `pytest tests/lib -m "science"`
# Dockerfile 走 pip install . 时不装（生产镜像不背 GB 级依赖），
# 需要 dowhy 时通过可选 extra 或 docker-compose 单独 sidecar 提供。
science = [
    "dowhy>=0.11,<1.0",
    "causalinference>=0.4.7",
    "scipy>=1.11",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "networkx>=3.2",
]

# D1 联邦层重型库（2026-10-18 补齐）：flwr 单机多租户 fabric 的严格模式
# 分支此前被 `pragma: no cover` + CI 从不安装双重掩盖。CI heavy-lib job
# 装 .[federated] 后跑 tests/test_heavy_lib_ci.py 真实执行。
# pymc / xgrammar / ragas / biomni 暂不列入（安装成本高、测试仅探针），
# 保持 CI 时长可控；其分支由 tests/test_heavy_lib_ci.py 的 skipif 诚实跳过。
federated = [
    "flwr>=1.0",
]

dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "aiosqlite>=0.19",
]

# ============================================================
# 【关键】显式声明包发现规则。
#
# 缺失此配置时，setuptools 走 flat-layout 自动发现，而本仓库根目录有多个
# 顶层目录（app/ healthlens_agent/ skills/ alembic/ frontend/ data/ nginx/
# reports/ goai_borrow/ ...），于是直接报：
#   error: Multiple top-level packages discovered in a flat-layout
# 这是 CI 作业 "Lint & Test" 的 `pip install -e ".[dev]"` 自 2026-09 起
# 一直红的直接原因（run 34938135916），Dockerfile 的 `pip install .`
# 同样会踩同一个坑——生产镜像是加这些目录之前构建的才没暴露。
#
# 只打包真正被 import 的两个包：app 与 healthlens_agent。
# skills/ 由 `python skills/<name>/test.py` 直接执行，不需打包；
# goai_borrow/ 全仓无任何 import 引用。
# ============================================================
[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["app*", "healthlens_agent*"]
exclude = ["data*", "nginx*", "reports*", "frontend*", "goai_borrow*", "alembic*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
