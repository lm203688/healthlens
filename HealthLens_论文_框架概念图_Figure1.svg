<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 11px; fill: #666; }
      .section-label { font-size: 13px; font-weight: 600; fill: #333; }
      .axis-label { font-size: 10px; font-weight: 500; fill: #fff; }
      .axis-sub { font-size: 8px; fill: rgba(255,255,255,0.8); }
      .flow-label { font-size: 10px; font-weight: 500; fill: #555; }
      .arrow-label { font-size: 9px; fill: #888; }
      .box-label { font-size: 11px; font-weight: 500; fill: #333; }
      .box-sub { font-size: 9px; fill: #777; }
      .loop-label { font-size: 12px; font-weight: 600; fill: #e74c3c; }
      .legend-text { font-size: 9px; fill: #555; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e74c3c"/>
    </marker>
    <linearGradient id="g-classical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="100%" style="stop-color:#A0522D"/>
    </linearGradient>
    <linearGradient id="g-gene" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50"/>
      <stop offset="100%" style="stop-color:#34495E"/>
    </linearGradient>
    <linearGradient id="g-fusion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A085"/>
      <stop offset="100%" style="stop-color:#1ABC9C"/>
    </linearGradient>
    <linearGradient id="g-output" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2980B9"/>
      <stop offset="100%" style="stop-color:#3498DB"/>
    </linearGradient>
    <linearGradient id="g-loop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E74C3C"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="600" y="35" text-anchor="middle" class="title">Figure 1. ISSBF Framework: From Classical-Text and Genome Fusion to Closed-Loop Validation</text>
  <text x="600" y="52" text-anchor="middle" class="subtitle">Integrated Steady-State Biology Framework — Ten Axioms, Ten Axes, SIIV Loop</text>

  <!-- ========== ROW 1: INPUT LAYER ========== -->
  <text x="30" y="90" class="section-label">Input Layer</text>

  <!-- Classical Text Box -->
  <rect x="40" y="105" width="260" height="110" rx="10" fill="url(#g-classical)" opacity="0.95"/>
  <text x="170" y="135" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Classical Text Corpus</text>
  <text x="170" y="155" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Huangdi Neijing, Shanghan Lun,</text>
  <text x="170" y="168" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Bencao Gangmu, Yijing, etc.</text>
  <line x1="60" y1="180" x2="280" y2="180" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <text x="170" y="198" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">Nature-flavor (四气五味) + Meridian tropism (归经)</text>

  <!-- Gene Panel Box -->
  <rect x="40" y="230" width="260" height="100" rx="10" fill="url(#g-gene)" opacity="0.95"/>
  <text x="170" y="258" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Genome / Gene Panel</text>
  <text x="170" y="278" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Consumer array / WGS pathway scores</text>
  <line x1="60" y1="290" x2="280" y2="290" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <text x="170" y="308" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">Ten-axis pathway weakness scores (0–1)</text>

  <!-- ========== ROW 1: TEN AXES ========== -->
  <text x="380" y="90" class="section-label">Ten-Axis Mapping</text>

  <!-- Axis circles -->
  <circle cx="400" cy="145" r="22" fill="#E74C3C"/><text x="400" y="142" text-anchor="middle" class="axis-label">A</text><text x="400" y="154" text-anchor="middle" class="axis-sub">AMPK</text>
  <circle cx="450" cy="145" r="22" fill="#E67E22"/><text x="450" y="142" text-anchor="middle" class="axis-label">B</text><text x="450" y="154" text-anchor="middle" class="axis-sub">Mito</text>
  <circle cx="500" cy="145" r="22" fill="#F39C12"/><text x="500" y="142" text-anchor="middle" class="axis-label">C</text><text x="500" y="154" text-anchor="middle" class="axis-sub">Seno</text>
  <circle cx="550" cy="145" r="22" fill="#27AE60"/><text x="550" y="142" text-anchor="middle" class="axis-label">D</text><text x="550" y="154" text-anchor="middle" class="axis-sub">Circ</text>
  <circle cx="600" cy="145" r="22" fill="#2980B9"/><text x="600" y="142" text-anchor="middle" class="axis-label">E</text><text x="600" y="154" text-anchor="middle" class="axis-sub">HPA</text>

  <circle cx="400" cy="205" r="22" fill="#8E44AD"/><text x="400" y="202" text-anchor="middle" class="axis-label">F</text><text x="400" y="214" text-anchor="middle" class="axis-sub">Imm</text>
  <circle cx="450" cy="205" r="22" fill="#9B59B6"/><text x="450" y="202" text-anchor="middle" class="axis-label">G</text><text x="450" y="214" text-anchor="middle" class="axis-sub">Psy</text>
  <circle cx="500" cy="205" r="22" fill="#3498DB"/><text x="500" y="202" text-anchor="middle" class="axis-label">H</text><text x="500" y="214" text-anchor="middle" class="axis-sub">Stem</text>
  <circle cx="550" cy="205" r="22" fill="#1ABC9C"/><text x="550" y="202" text-anchor="middle" class="axis-label">I</text><text x="550" y="214" text-anchor="middle" class="axis-sub">Exo</text>
  <circle cx="600" cy="205" r="22" fill="#16A085"/><text x="600" y="202" text-anchor="middle" class="axis-label">J</text><text x="600" y="214" text-anchor="middle" class="axis-sub">Regen</text>

  <!-- Axis labels row -->
  <text x="400" y="248" text-anchor="middle" font-size="8" fill="#666">A: Qi-Hua</text>
  <text x="450" y="248" text-anchor="middle" font-size="8" fill="#666">B: Blood-Mito</text>
  <text x="500" y="248" text-anchor="middle" font-size="8" fill="#666">C: Luo-Seno</text>
  <text x="550" y="248" text-anchor="middle" font-size="8" fill="#666">D: Yin-Yang</text>
  <text x="600" y="248" text-anchor="middle" font-size="8" fill="#666">E: Zang-Fu</text>
  <text x="400" y="258" text-anchor="middle" font-size="8" fill="#666">F: Zheng-Xie</text>
  <text x="450" y="258" text-anchor="middle" font-size="8" fill="#666">G: Shen-Qing</text>
  <text x="500" y="258" text-anchor="middle" font-size="8" fill="#666">H: Xian-Tian</text>
  <text x="550" y="258" text-anchor="middle" font-size="8" fill="#666">I: Exosome</text>
  <text x="600" y="258" text-anchor="middle" font-size="8" fill="#666">J: Regen</text>

  <!-- Axioms label -->
  <rect x="380" y="275" width="240" height="30" rx="6" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="0.5"/>
  <text x="500" y="295" text-anchor="middle" font-size="10" fill="#555" font-weight="500">Six Axioms (A1–A6) govern all mappings</text>

  <!-- ========== ARROWS: INPUT → AXES ========== -->
  <line x1="300" y1="160" x2="375" y2="145" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="300" y1="280" x2="375" y2="205" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== ROW 2: FUSION ========== -->
  <text x="680" y="90" class="section-label">Fusion Judgment</text>

  <!-- Fusion box -->
  <rect x="680" y="105" width="220" height="100" rx="10" fill="url(#g-fusion)" opacity="0.95"/>
  <text x="790" y="130" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Intersection Fusion</text>
  <text x="790" y="150" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Classical candidate ∩ Genetic weakness</text>
  <line x1="700" y1="162" x2="880" y2="162" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <text x="790" y="180" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">Personalized recommendation pool</text>
  <text x="790" y="193" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">Evidence-graded (L1/L2/L3)</text>

  <!-- Arrow: Axes → Fusion -->
  <line x1="620" y1="175" x2="680" y2="155" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== ROW 3: OUTPUT ========== -->
  <text x="30" y="370" class="section-label">Output Layer</text>

  <!-- Recommendations box -->
  <rect x="40" y="385" width="260" height="100" rx="10" fill="url(#g-output)" opacity="0.95"/>
  <text x="170" y="410" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Non-Pharmacological Recommendations</text>
  <text x="170" y="430" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Daoyin / Fasting / Food-as-medicine</text>
  <text x="170" y="443" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="9">Circadian rhythm / Affect regulation</text>
  <line x1="60" y1="455" x2="280" y2="455" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
  <text x="170" y="472" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="9">Exosome / Regen-medicine lifestyle support</text>

  <!-- Arrow: Fusion → Output -->
  <line x1="790" y1="205" x2="790" y2="270" stroke="#999" stroke-width="1.5"/>
  <line x1="790" y1="270" x2="300" y2="400" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="330" text-anchor="middle" class="arrow-label">personalized, evidence-graded</text>

  <!-- ========== SIIV LOOP ========== -->
  <text x="400" y="370" class="section-label">SIIV Closed Loop</text>

  <!-- Loop circle -->
  <rect x="380" y="385" width="400" height="130" rx="12" fill="none" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="580" y="405" text-anchor="middle" class="loop-label">SIIV = Sense → Infer → Intervene → Verify</text>

  <!-- S -->
  <rect x="400" y="420" width="75" height="50" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="437" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#c0392b">Sense</text>
  <text x="437" y="456" text-anchor="middle" font-size="8" fill="#e74c3c">HRV / CGM / EEG</text>

  <!-- I1 -->
  <rect x="495" y="420" width="75" height="50" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="532" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#c0392b">Infer</text>
  <text x="532" y="456" text-anchor="middle" font-size="8" fill="#e74c3c">10-axis scoring</text>

  <!-- I2 -->
  <rect x="590" y="420" width="75" height="50" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="627" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#c0392b">Intervene</text>
  <text x="627" y="456" text-anchor="middle" font-size="8" fill="#e74c3c">Non-drug plans</text>

  <!-- V -->
  <rect x="685" y="420" width="75" height="50" rx="6" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="722" y="442" text-anchor="middle" font-size="10" font-weight="600" fill="#c0392b">Verify</text>
  <text x="722" y="456" text-anchor="middle" font-size="8" fill="#e74c3c">Re-measure axes</text>

  <!-- Loop arrows -->
  <path d="M 475 445 L 495 445" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M 570 445 L 590 445" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M 665 445 L 685 445" stroke="#e74c3c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <!-- Return arrow -->
  <path d="M 722 470 L 722 485 L 437 485 L 437 470" stroke="#e74c3c" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
  <text x="580" y="497" text-anchor="middle" font-size="8" fill="#e74c3c">continuous weight update</text>

  <!-- ========== ROW 4: HARDWARE + VALIDATION ========== -->
  <text x="30" y="555" class="section-label">Hardware &amp; Validation Layer</text>

  <!-- Hardware boxes -->
  <rect x="40" y="570" width="130" height="70" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="105" y="592" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Wearables</text>
  <text x="105" y="606" text-anchor="middle" font-size="8" fill="#777">HRV / Sleep / SpO2</text>
  <text x="105" y="618" text-anchor="middle" font-size="8" fill="#777">Apple Watch, Garmin</text>

  <rect x="185" y="570" width="130" height="70" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="250" y="592" text-anchor="middle" font-size="10" font-weight="600" fill="#333">CGM</text>
  <text x="250" y="606" text-anchor="middle" font-size="8" fill="#777">Postprandial glucose</text>
  <text x="250" y="618" text-anchor="middle" font-size="8" fill="#777">Dexcom, Libre</text>

  <rect x="330" y="570" width="130" height="70" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="395" y="592" text-anchor="middle" font-size="10" font-weight="600" fill="#333">BCI / EEG</text>
  <text x="395" y="606" text-anchor="middle" font-size="8" fill="#777">Frontal alpha asymmetry</text>
  <text x="395" y="618" text-anchor="middle" font-size="8" fill="#777">Emotiv, Muse</text>

  <rect x="475" y="570" width="130" height="70" rx="8" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="540" y="592" text-anchor="middle" font-size="10" font-weight="600" fill="#333">BioWell GDV</text>
  <text x="540" y="606" text-anchor="middle" font-size="8" fill="#777">Meridian photon emission</text>
  <text x="540" y="618" text-anchor="middle" font-size="8" fill="#777">Periodic assessment</text>

  <!-- Validation box -->
  <rect x="640" y="570" width="260" height="70" rx="8" fill="#fdebd0" stroke="#f39c12" stroke-width="1"/>
  <text x="770" y="592" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Computational Validation</text>
  <text x="770" y="606" text-anchor="middle" font-size="8" fill="#777">Reproducibility 100% | Specificity 100%</text>
  <text x="770" y="618" text-anchor="middle" font-size="8" fill="#777">Coverage 100% | Convergent validity 85%</text>
  <text x="770" y="630" text-anchor="middle" font-size="8" fill="#777">n=22 synthetic profiles (20 weakness + 2 control)</text>

  <!-- ========== ROW 5: FRONTIER INTEGRATION ========== -->
  <text x="30" y="680" class="section-label">Frontier Integration</text>

  <rect x="40" y="695" width="160" height="60" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="120" y="715" text-anchor="middle" font-size="10" font-weight="600" fill="#1e8449">C2S-Scale</text>
  <text x="120" y="730" text-anchor="middle" font-size="8" fill="#27ae60">Conditional reasoning</text>
  <text x="120" y="742" text-anchor="middle" font-size="8" fill="#27ae60">Context-dependent efficacy</text>

  <rect x="215" y="695" width="160" height="60" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="1"/>
  <text x="295" y="715" text-anchor="middle" font-size="10" font-weight="600" fill="#1e8449">GeneLLM</text>
  <text x="295" y="730" text-anchor="middle" font-size="8" fill="#27ae60">cfRNA language model</text>
  <text x="295" y="742" text-anchor="middle" font-size="8" fill="#27ae60">Pseudo-biomarker discovery</text>

  <rect x="390" y="695" width="160" height="60" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="1"/>
  <text x="470" y="715" text-anchor="middle" font-size="10" font-weight="600" fill="#1e8449">CD4 Senescence</text>
  <text x="470" y="730" text-anchor="middle" font-size="8" fill="#27ae60">Immune aging cross-axis</text>
  <text x="470" y="742" text-anchor="middle" font-size="8" fill="#27ae60">F-axis + H-axis anchor</text>

  <rect x="565" y="695" width="160" height="60" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="1"/>
  <text x="645" y="715" text-anchor="middle" font-size="10" font-weight="600" fill="#1e8449">mRNA-LNP</text>
  <text x="645" y="730" text-anchor="middle" font-size="8" fill="#27ae60">Senescence reprogramming</text>
  <text x="645" y="742" text-anchor="middle" font-size="8" fill="#27ae60">C-axis + J-axis frontier</text>

  <rect x="740" y="695" width="160" height="60" rx="8" fill="#d4efdf" stroke="#27ae60" stroke-width="1"/>
  <text x="820" y="715" text-anchor="middle" font-size="10" font-weight="600" fill="#1e8449">BioFord</text>
  <text x="820" y="730" text-anchor="middle" font-size="8" fill="#27ae60">Lab-as-code infrastructure</text>
  <text x="820" y="742" text-anchor="middle" font-size="8" fill="#27ae60">Future validation flywheel</text>

  <!-- ========== LEGEND ========== -->
  <rect x="930" y="105" width="250" height="200" rx="8" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="1055" y="128" text-anchor="middle" font-size="11" font-weight="600" fill="#333">Legend</text>

  <rect x="945" y="140" width="14" height="14" rx="3" fill="url(#g-classical)"/>
  <text x="970" y="152" class="legend-text">Classical text input</text>

  <rect x="945" y="162" width="14" height="14" rx="3" fill="url(#g-gene)"/>
  <text x="970" y="174" class="legend-text">Genome / gene panel input</text>

  <rect x="945" y="184" width="14" height="14" rx="3" fill="url(#g-fusion)"/>
  <text x="970" y="196" class="legend-text">Fusion judgment (intersection)</text>

  <rect x="945" y="206" width="14" height="14" rx="3" fill="url(#g-output)"/>
  <text x="970" y="218" class="legend-text">Non-pharmacological output</text>

  <rect x="945" y="228" width="14" height="14" rx="3" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="970" y="240" class="legend-text">SIIV closed loop</text>

  <rect x="945" y="250" width="14" height="14" rx="3" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="970" y="262" class="legend-text">Frontier integration</text>

  <rect x="945" y="272" width="14" height="14" rx="3" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="970" y="284" class="legend-text">Hardware interface</text>

  <!-- Footer -->
  <text x="600" y="780" text-anchor="middle" font-size="9" fill="#aaa">Li Xing (2026). HealthLens — Integrated Steady-State Biology Framework. Manuscript Figure 1.</text>
</svg>